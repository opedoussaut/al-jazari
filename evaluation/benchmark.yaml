# JAZARI benchmark v0.2 (M3).
#
# Every expected value was checked by hand against the pinned sources:
#   unitree_ros@15ebe53f4cd77e7d745ae83b9d7ff90e685e8998 robots/g1_description/g1_29dof_rev_1_0.{urdf,xml}
#   lite_description@e582f6b27e2f4954d914f5db9d46e6dd409c74fb robots/lite/{urdf,mjcf}, robots/lite_biped/{xacro,mjcf}
#   mujoco_menagerie@f3b6013629c7b94f8ee93fd977b161fa8350f9bc aloha/aloha.xml (+ joint_position_actuators.xml)
#   IEEE1872-owl@ffb6613350b28c3a710f8daf2a1e9e953ded7ed8
# Fields:
#   tools        - at least one of these tools must be called (tool-selection score); [] = no tool needed
#   facts        - strings/numbers that must all appear in the answer (automated)
#   abstain      - true if the correct behaviour is to say the knowledge is not available
#   forbidden    - strings that must not appear (e.g. values from another robot)
#   review       - "auto" (fully automated) or "expert" (facts are necessary, not sufficient)
version: 0.2.1
items:
  # ---------------------------------------------------------------- ontology
  - id: ont-01
    category: ontology
    question: What is a robot according to CORA?
    tools: [ontology_lookup]
    facts: [Agent, Device]
    concepts: [cora:Robot]
    source: IEEE1872-owl cora.owl (Robot subClassOf Agent, Device)
    review: expert
  - id: ont-02
    category: ontology
    question: Which ontology defines the property that relates a robot to its actuating parts?
    tools: [ontology_lookup]
    facts: [robotActuatingPart]
    concepts: [rparts:robotActuatingPart]
    source: IEEE1872-owl rparts.owl
    review: auto
  - id: ont-03
    category: ontology
    question: What is the domain and range of rparts:robotSensingPart?
    tools: [ontology_lookup]
    facts: [Device, Robot]
    source: IEEE1872-owl rparts.owl (axioms 8.1.2, 8.1.3)
    review: auto
  - id: ont-04
    category: ontology
    question: What is the parent property of robotActuatingPart in IEEE 1872?
    tools: [ontology_lookup]
    facts: [robotPart]
    source: IEEE1872-owl rparts.owl (axiom 8.2.1)
    review: auto
  - id: ont-05
    category: ontology
    question: What is the difference between a robot and a robotic system in CORA?
    tools: [ontology_lookup]
    facts: [RoboticSystem, ArtificialSystem]
    source: IEEE1872-owl cora-bare.owl, cora.owl
    review: expert
  - id: ont-06
    category: ontology
    question: What are the subclasses of RoboticSystem in CORA?
    tools: [ontology_lookup]
    facts: [SingleRoboticSystem, CollectiveRoboticSystem]
    source: IEEE1872-owl cora-bare.owl
    review: auto
  - id: ont-07
    category: ontology
    question: How does JAZARI model a robot joint, and what is its superclass?
    tools: [ontology_lookup]
    facts: [ModelElement]
    source: ontology/jazari/jazari.ttl
    review: auto
  - id: ont-08
    category: ontology
    question: Is jz:RobotConfiguration a design or a physical object in the ontology?
    tools: [ontology_lookup]
    facts: [Design]
    source: ontology/jazari/jazari.ttl (RobotConfiguration subClassOf corax:Design)
    review: auto
  - id: ont-09
    category: ontology
    question: Which IEEE 1872 axiom number gives the range of robotSensingPart?
    tools: [ontology_lookup]
    facts: ["8.1.3"]
    source: IEEE1872-owl rparts.owl annotation ieee18722015AxiomNumber
    review: auto
  - id: ont-10
    category: ontology
    question: What is a processing device in CORAX, and what is it a subclass of?
    tools: [ontology_lookup]
    facts: [ElectricDevice]
    source: IEEE1872-owl corax.owl
    review: auto


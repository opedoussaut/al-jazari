[project]
name = "jazari"
version = "0.1.0"
description = "JAZARI - an open-source, knowledge-driven robotics AI expert"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "lxml>=5.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
jazari = "jazari.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jazari"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sources: needs pinned upstream sources fetched with `jazari fetch`",
    "ollama: needs a running Ollama server",
]

[tool.ruff]
line-length = 100
